name: Job Board Full Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - run: npm install
      - run: npm test

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
      - run: npm install
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set Image Tag
        id: set_tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build Application Packages
        run: |
          echo "Всі 4 тести пройшли успішно."
          echo "Збираємо артефакти та Docker-образи для версії: ${{ steps.set_tag.outputs.tag }}"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
    steps:
      - name: Deploy to Staging Environment
        run: |
          echo "Розгортаємо версію ${{ needs.build.outputs.image_tag }} на Staging..."
          echo "Виконуємо міграції тестової БД та проганяємо валідацію."

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment:
      name: production
    steps:
      - name: Deploy to Production Environment
        run: |
          echo "Розгортаємо фінальну версію ${{ needs.build.outputs.image_tag }} на Production..."
          echo "Система оновлена для кінцевих користувачів."